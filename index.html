<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="记得" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=5">
  <title>记得 · 生活提醒</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div><div class="eyebrow" id="todayLabel"></div><h1>记得</h1></div>
    <div class="header-actions"><span class="version-badge" id="versionBadge">V5</span><button class="icon-btn" id="notifyBtn">🔔</button></div>
  </header>

  <main>
    <section class="hero">
      <p class="hero-title">最近需要你操心的事</p>
      <div id="urgentList" class="stack"></div>
    </section>

    <section class="quick-grid">
      <button class="quick-card" data-jump="quickInput"><span>✍️</span><b>记一件事</b><small>一句话快速记录</small></button>
      <button class="quick-card" id="openTrain"><span>🚄</span><b>火车票</b><small>自动算购票日</small></button>
      <button class="quick-card" id="openCatModal2"><span>🐱</span><b>猫咪</b><small>记录消耗并自动预测</small></button>
    </section>

    <section class="quick-add card">
      <label for="quickInput">记一件事</label>
      <div class="input-row"><input id="quickInput" placeholder="例如：15天后买火车票"><button id="quickAddBtn">添加</button></div>
      <p class="hint">支持：明天 / 后天 / X天后 / X周后 / X月后 / 每X天重复</p>
    </section>

    <section class="section-head"><h2>🚄 火车票提醒</h2><button class="link-btn" id="openTrain2">新增</button></section>
    <section id="trainList" class="stack"></section>

    <section class="section-head"><h2>待办</h2><button class="link-btn" id="clearDoneBtn">清理已完成</button></section>
    <section id="todoList" class="stack"></section>

    <section class="section-head"><h2>🐱 猫咪管家</h2><button class="link-btn" id="openCatModal">新增</button></section>
    <section id="catList" class="stack"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home">今天</button>
    <button class="tab" data-tab="train">火车票</button>
    <button class="tab" data-tab="cat">猫咪</button>
  </nav>
</div>

<dialog id="trainDialog">
<form method="dialog" id="trainForm">
  <h3>🚄 新增火车票提醒</h3>
  <div class="two-col">
    <label>出发站<input id="fromStation" required placeholder="例如：北京西"></label>
    <label>到达站<input id="toStation" placeholder="例如：上海虹桥"></label>
  </div>
  <label>出发日期<input id="departDate" type="date" required></label>
  <label class="switch-row"><input id="roundTrip" type="checkbox"> 往返行程</label>
  <label id="returnDateWrap" style="display:none">返程日期<input id="returnDate" type="date"></label>
  <div class="two-col">
    <label>预售期（天）<input id="presaleDays" type="number" min="1" value="15"></label>
    <label>起售时间<input id="saleTime" type="time" value="09:00"></label>
  </div>
  <label>提醒方式
    <select id="leadPreset">
      <option value="1">购票日前1天 + 开售当天</option>
      <option value="0">仅开售当天</option>
      <option value="3">提前3天 + 开售当天</option>
    </select>
  </label>
  <div class="preview" id="trainPreview">选择出发日期后，这里会显示预计购票日。</div>
  <p class="hint">默认按15天预售期计算。不同车站起售时间可能不同，请以12306/车站公告为准。</p>
  <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveTrainBtn" value="default">保存提醒</button></div>
</form>
</dialog>


<dialog id="catDialog">
<form method="dialog" id="catForm">
  <h3>🐱 新增猫咪用品</h3>
  <label>用品名称<input id="catName" required placeholder="例如：猫粮、猫罐头、猫砂、滤芯"></label>
  <label>类型
    <select id="catType">
      <option value="consumable">消耗型用品（自动预测）</option>
      <option value="fixed">固定周期事项</option>
    </select>
  </label>
  <div id="consumableFields">
    <label>第一次记录日期<input id="catFirstDate" type="date" required></label>
    <label>提前提醒（天）<input id="catLeadDays" type="number" min="0" value="5"></label>
    <p class="hint">第一次只记录实际购买/更换时间；第二次再记录后，系统会自动计算间隔并预测下一次。</p>
  </div>
  <div id="fixedFields" style="display:none">
    <label>下一次日期<input id="catFixedDate" type="date"></label>
    <label>固定周期
      <select id="catCycle">
        <option value="7">每7天</option><option value="14">每14天</option><option value="30" selected>每30天</option>
        <option value="60">每60天</option><option value="90">每90天</option><option value="180">每180天</option>
      </select>
    </label>
  </div>
  <label>备注<input id="catNote" placeholder="品牌、规格、用途等"></label>
  <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default">保存</button></div>
</form>
</dialog>

<dialog id="catRecordDialog">
<form method="dialog" id="catRecordForm">
  <h3>记录一次</h3>
  <div class="record-item-name" id="catRecordName"></div>
  <label>本次日期<input id="catRecordDate" type="date" required></label>
  <label>备注<input id="catRecordNote" placeholder="例如：买了2袋、换了新滤芯"></label>
  <input type="hidden" id="catRecordId">
  <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default">保存记录</button></div>
</form>
</dialog>

<dialog id="catHistoryDialog">
<form method="dialog">
  <h3 id="catHistoryTitle">记录历史</h3>
  <div id="catHistoryList" class="history-list"></div>
  <div class="dialog-actions"><button value="cancel" class="ghost">关闭</button></div>
</form>
</dialog>


<template id="itemTemplate">
  <article class="item-card"><div class="item-main"><div class="item-title"></div><div class="item-meta"></div></div><div class="item-actions"></div></article>
</template>

<script src="app.js?v=5"></script>

<div class="update-toast" id="updateToast" hidden>
  <div>
    <b id="updateTitle">发现新版本</b>
    <div class="update-text" id="updateText">正在更新「记得」…</div>
  </div>
  <button id="updateReloadBtn" hidden>立即刷新</button>
</div>

</body>
</html>
